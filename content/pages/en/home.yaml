title: StateSurface
hero:
  badge: State-Layout Mapping Runtime
  title: 'Server-owned state,'
  highlight: streamed into your page.
  description: Server owns state. Client owns DOM projection. Pages are MPA, in-page updates come from NDJSON state streams. Define surfaces, templates, transitions, and actions — the engine handles the rest.
  primaryLabel: 10-Min Quickstart
  primaryHref: /guide/quickstart
  secondaryLabel: Try Streaming Demo
  secondaryHref: /examples/streaming
  commandLabel: Create an app
  command: npx create-state-surface my-app
  imageAlt: 'Diagram: a transition yields states, the server streams NDJSON ops, and <h-state> slots update in place.'
sections:
  concepts:
    eyebrow: Core concepts
    title: Four pieces, one mental model
    description: A page places slots, components render their state, transitions stream new state and actions start them from plain HTML.
    linkLabel: Read the guide
  features:
    eyebrow: Live demos
    title: Watch the slots update
    description: Every demo is a page of this site. Open one and see the server stream state into it.
    linkLabel: Open the demo
concepts:
  - key: surface
    title: Surface
    description: Pages are TSX functions that place <Slot> boundaries. Each slot renders an <h-state> anchor; slots with mode="server" or a client:* directive are the ones transitions update.
    href: /guide/surface
  - key: template
    title: Template
    description: 'Slot child components in TSX. Their props are the slot state: the server renders them, or a client:* directive hydrates them in the browser.'
    href: /guide/template
  - key: transition
    title: Transition
    description: Server-side async generators that yield state frames. Full frames set the complete state of the transition's targets; partial frames update selected slots progressively.
    href: /guide/transition
  - key: action
    title: Action
    description: Declarative triggers via data-action attributes. No JS event wiring in user code — the engine handles delegation, pending states, and abort.
    href: /guide/action
features:
  - title: Streaming Demo
    description: Watch full/partial frames, removed keys, and error frames in real time.
    href: /examples/streaming
  - title: Actions Playground
    description: Try button actions, form submissions, scoped pending, and multiple actions.
    href: /examples/actions
  - title: Search
    description: Search StateSurface features and concepts with form-based actions.
    href: /examples/search
cta:
  title: Build your first page in 10 minutes
  description: One page, two components and one transition. No fetch calls, no client-side state, no abort handling.
  primaryLabel: Start the quickstart
  primaryHref: /guide/quickstart
  secondaryLabel: Browse examples
  secondaryHref: /examples
