title: View Transition Demo
description:
  title: View Transition Name Morphing
  description: Click a card to see the element morph smoothly into a detail view via view-transition-name. Press "Back to Gallery" for the reverse morph.
cards:
  - id: alpha
    title: Alpha
    color: indigo
    description: Demonstrates morphing between card and detail view via view-transition-name.
    detail: The View Transition API captures snapshots before and after DOM changes, creating smooth animations automatically. Elements sharing the same view-transition-name morph their position and size seamlessly.
  - id: beta
    title: Beta
    color: emerald
    description: Implemented with just CSS and inline styles — no framework changes needed.
    detail: 'The transition opts in with defineTransition({ viewTransition: true }); templates only set style={{ viewTransitionName: "name" }} and matching elements morph.'
  - id: gamma
    title: Gamma
    color: amber
    description: Falls back to instant transitions in unsupported browsers (progressive enhancement).
    detail: The engine checks for document.startViewTransition and calls the callback directly in unsupported browsers. Functionality works identically — only the animation is skipped.
backLabel: Back to Gallery
