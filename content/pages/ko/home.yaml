title: StateSurface
hero:
  badge: 상태-레이아웃 매핑 런타임
  title: StateSurface
  description: 서버가 상태를 소유하고, 클라이언트가 DOM 프로젝션을 담당합니다. 페이지는 MPA, 페이지 내 업데이트는 NDJSON 상태 스트림으로 전달됩니다. Surface, Template, Transition, Action을 정의하면 엔진이 나머지를 처리합니다.
  primaryLabel: 10분 퀵스타트
  primaryHref: /guide/quickstart
  secondaryLabel: 스트리밍 데모
  secondaryHref: /examples/streaming
  imageAlt: '다이어그램: transition이 상태를 yield하고 서버가 NDJSON op을 스트리밍하면 <h-state> 슬롯이 제자리에서 갱신됩니다.'
concepts:
  - key: surface
    title: Surface
    description: 페이지는 <Slot> 경계를 배치하는 TSX 함수입니다. 각 슬롯은 <h-state> 앵커가 되며, mode="server"나 client:* 지시자가 있는 슬롯을 transition이 갱신합니다.
    href: /guide/surface
  - key: template
    title: Template
    description: Slot 자식 TSX 컴포넌트입니다. props가 곧 슬롯 상태이며, 서버가 렌더하거나 client:* 지시자로 브라우저에서 하이드레이션합니다.
    href: /guide/template
  - key: transition
    title: Transition
    description: 서버 측 async generator가 상태 프레임을 yield합니다. Full 프레임은 transition targets의 전체 상태를 정하고, Partial 프레임은 선택한 슬롯을 점진적으로 갱신합니다.
    href: /guide/transition
  - key: action
    title: Action
    description: data-action 속성을 통한 선언적 트리거. 사용자 코드에 JS 이벤트 바인딩이 필요 없으며, 엔진이 위임, pending 상태, abort를 처리합니다.
    href: /guide/action
features:
  - title: 스트리밍 데모
    description: Full/Partial 프레임, removed 키, error 프레임을 실시간으로 확인하세요.
    href: /examples/streaming
  - title: 액션 플레이그라운드
    description: 버튼 액션, 폼 제출, 스코프드 pending, 다중 액션을 체험하세요.
    href: /examples/actions
  - title: 검색
    description: 폼 기반 액션으로 StateSurface 기능과 개념을 검색하세요.
    href: /examples/search
