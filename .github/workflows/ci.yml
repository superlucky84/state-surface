name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run tests
        run: pnpm test

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base_path: ['', '/demo']
    env:
      BASE_PATH: ${{ matrix.base_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e --project=demo-parity
      - if: matrix.base_path == ''
        run: pnpm test:spikes
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/

  performance:
    # Stage 0 reports measurements; thresholds become required only in stage 10.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm perf
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: perf/results/

  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [node, express, bun, deno, cloudflare]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: matrix.adapter == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - if: matrix.adapter == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:server
      - run: pnpm build:conformance
      - run: pnpm check:core
      - run: pnpm test:conformance ${{ matrix.adapter }}
      - if: matrix.adapter == 'node'
        run: pnpm build && pnpm test:legacy && pnpm build:adapter-app
